<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدينة جداول الضرب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: sticker-style cartoon board, 4x4 serpentine road, players beside it on desktop, stacked above on phones */
:root{
  --sky:#CFEBFF; --sky-2:#EAF7FF; --ink:#16296B; --ink-2:#3C4C85; --paper:#FFFDF4;
  --sun:#FFC52E; --sun-d:#E39A00; --wood:#A2622F; --wood-l:#CF9250;
  --grass:#9ADB74; --grass-d:#5DAE3F; --road:#5C6786;
  --coral:#F2603F; --violet:#7A55D9; --blue:#2E86F0; --green:#3DB24A;
  --p0:#2F7BEA; --p1:#2BA84A; --ok:#2FA84F; --bad:#E5483B;
  --f-display:'Baloo Bhaijaan 2','Tajawal','Segoe UI',Tahoma,sans-serif;
  --f-body:'Tajawal','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:linear-gradient(var(--sky) 0,var(--sky-2) 280px) no-repeat,var(--sky-2);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:16px 28px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.eq{direction:ltr;unicode-bidi:isolate;display:block;text-align:center;font-family:var(--f-display);font-weight:700}
:focus-visible{outline:4px solid var(--sun-d);outline-offset:2px}
.wrap{max-width:1040px;margin-inline:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:10px 22px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{font-size:1rem;padding:6px 14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.sm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff}
.btn.green{background:#7ED957}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* setup */
.hero{display:grid;gap:10px;justify-items:center;text-align:center;padding-top:6px}
.hero img.castle{width:min(38vw,210px);filter:drop-shadow(0 6px 0 rgba(22,41,107,.18))}
/* home screen math world: floating numbers, × signs, square arrays and shapes behind the content */
.setup-s{position:relative}
.setup-s>*:not(.mathbg){position:relative;z-index:1}
.mathbg{position:absolute;inset:-16px;overflow:hidden;pointer-events:none;z-index:0}
.mb{position:absolute;transform:translate(-50%,-50%) rotate(var(--r)) scale(var(--s));animation:mbfloat 7s ease-in-out infinite;opacity:.5}
.mb svg{display:block}
@keyframes mbfloat{50%{margin-top:-14px}}
.mbn{font-family:var(--f-display);font-weight:800;font-size:2.7rem;line-height:1;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.herorow{display:flex;align-items:flex-end;justify-content:center;gap:clamp(2px,3vw,30px)}
.kid{margin:0;display:grid;justify-items:center;gap:4px;animation:kidbob 2.4s ease-in-out infinite}
.kid.k1{animation-delay:-1.2s}
.kid img{height:clamp(100px,27vw,185px);width:auto;max-width:none;filter:drop-shadow(0 5px 0 rgba(22,41,107,.18))}
.kid figcaption{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:0 12px;font-family:var(--f-display);font-weight:800;font-size:clamp(.85rem,3vw,1.1rem);box-shadow:0 3px 0 var(--ink)}
@keyframes kidbob{50%{transform:translateY(-7px)}}
.arrays{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;max-width:100%}
.arr{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;display:grid;justify-items:center;align-content:end;gap:4px;box-shadow:0 4px 0 var(--ink);min-width:0;background-image:linear-gradient(#E8EEFC 1px,transparent 1px),linear-gradient(90deg,#E8EEFC 1px,transparent 1px);background-size:12px 12px}
.arr svg{max-width:100%;height:auto;display:block}
.arr rect{transform-box:fill-box;transform-origin:center;animation:sqpop .35s ease-out both}
@keyframes sqpop{from{transform:scale(0)}}
.arreq{direction:ltr;unicode-bidi:isolate;font-family:var(--f-display);font-weight:800;font-size:1.3rem;line-height:1.1;background:#FFF3B0;border-radius:8px;padding:0 8px}
.arr small{font-size:.78rem;color:var(--ink-2);font-weight:700}
@media (max-width:420px){.arrays{gap:7px;flex-wrap:nowrap}.arr svg{max-width:64px}.arr{padding:6px 8px}.arreq{font-size:1.05rem}.arr small{display:none}}
.plank{background:linear-gradient(var(--wood-l),var(--wood));color:#fff;border:4px solid var(--ink);border-radius:14px;padding:2px 30px;font-family:var(--f-display);font-weight:800;font-size:1.5rem;box-shadow:0 4px 0 var(--ink);transform:rotate(-1.5deg)}
.banner{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,9vw,4rem);line-height:1.1;color:var(--sun);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);text-wrap:balance;padding:4px 10px 10px}
.tagline{margin:0;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 18px;font-weight:700;max-width:100%;text-wrap:balance}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:18px;box-shadow:0 7px 0 var(--ink)}
.setup{display:grid;gap:18px;max-width:720px;margin:22px auto 0}
.fields{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.lab{display:grid;gap:6px;font-weight:800;min-width:0}
.lab input{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:12px;padding:9px 12px;background:#fff;color:var(--ink);width:100%;min-width:0}
.plr{display:grid;gap:8px;align-content:start;min-width:0}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:46px;height:34px;padding:2px;border:3px solid transparent;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 rgba(22,41,107,.25)}
.sw svg{width:100%;height:auto;display:block}
.sw.on{border-color:var(--ink);background:#FFF3B0;box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.sw[disabled]{opacity:.3;cursor:not-allowed}
.lab .dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);vertical-align:middle;margin-inline-end:6px}
.levels{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.lvl{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;text-align:start;display:grid;gap:2px;box-shadow:0 4px 0 var(--ink)}
.lvl b{font-family:var(--f-display);font-size:1.15rem}
.lvl small{color:var(--ink-2);font-size:.92rem;line-height:1.4}
.lvl[aria-pressed="true"]{background:var(--sun)}
.lvl[aria-pressed="true"] small{color:var(--ink)}
.types{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;padding:3px 14px;color:#fff;font-weight:800}
.chip svg{width:20px;height:20px}
.h2{margin:0 0 8px;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.row-c{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* game */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--sun);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"players" "board"}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,640px) minmax(260px,1fr);grid-template-areas:"board players";align-items:start}}
#players{grid-area:players;display:grid;gap:12px;grid-template-columns:1fr 1fr;align-content:start}
@media (min-width:900px){#players{grid-template-columns:1fr}}
.boardbox{grid-area:board;min-width:0}
.pcard{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;min-width:0;transition:transform .2s}
.pcard.active{transform:translateY(-3px);box-shadow:0 7px 0 var(--pc)}
.pcard.active::before{content:"";position:absolute;inset:-10px;border:4px dashed var(--pc);border-radius:26px;opacity:.55;pointer-events:none}
.pcard .av{width:92px;align-self:center}
.pcard .av svg{width:100%;height:auto;display:block}
.pcard.active .av svg{animation:idle .35s ease-in-out infinite alternate}
.metag{background:var(--ink);color:#fff;border-radius:999px;font-size:.8rem;padding:0 10px;font-family:var(--f-body);font-weight:800}
/* online */
.olbadge{display:inline-flex;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 12px;font-weight:800;font-size:.95rem}
.olgrid{display:grid;gap:14px;grid-template-columns:1fr 1fr;align-items:end}
.olcol{display:grid;gap:8px;justify-items:start;min-width:0}
.joinrow{display:flex;gap:8px;width:100%}
.joinrow input{flex:1;min-width:0;font:inherit;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.2em;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff;color:var(--ink)}
.olmsg{margin:0 0 10px;background:#FFF3B0;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700}
.note{margin:8px 0 0;font-size:.9rem;color:var(--ink-2);font-weight:700}
.bigcode{font-family:var(--f-display);font-weight:800;font-size:3.4rem;letter-spacing:.18em;direction:ltr;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:0 18px 0 30px;box-shadow:0 5px 0 var(--ink);line-height:1.4}
.invite{display:grid;gap:8px;justify-items:center;width:100%}
.invite p{margin:0}
.invlink{background:#fff;border:3px dashed var(--ink);border-radius:12px;padding:6px 10px;font-size:.85rem;font-weight:700;word-break:break-all;max-width:100%;user-select:all}
.invname{width:min(100%,280px);text-align:start}
.invname input{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:12px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
.waiting{color:var(--ink-2);font-weight:800!important;animation:pulse 1.4s ease-in-out infinite}
.feed{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:45;max-width:min(92vw,520px);background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:8px 18px;font-weight:800;font-size:1.05rem;text-align:center;box-shadow:0 6px 0 var(--ink);transition:transform .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.feed.show{transform:translate(-50%,0)}
.feed.ok{background:#C9F2CF}.feed.bad{background:#FFD3CC}.feed.key{background:#FFF3B0}.feed.turn{background:var(--sun)}
.pinfo{display:grid;gap:3px;min-width:0}
.pname{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1.2;overflow-wrap:anywhere}
.pname i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--pc);border:3px solid var(--ink);flex:none}
.turntag{background:var(--pc);color:#fff;border-radius:999px;font-size:.8rem;padding:0 10px;font-family:var(--f-body);font-weight:800}
.pwhere{font-size:.88rem;color:var(--ink-2);line-height:1.3}
.starrow{display:flex;gap:2px;direction:ltr;justify-content:flex-end}
.starrow svg{width:24px;height:24px}
.keys{display:flex;gap:3px;direction:ltr;flex-wrap:wrap}
.keys img{height:28px;width:auto;opacity:.22;filter:grayscale(1);transition:.3s}
.keys img.on{opacity:1;filter:none}
.ptotal{font-size:.88rem;font-weight:700}
.board{position:relative;direction:ltr;width:100%;max-width:640px;aspect-ratio:100/116;margin-inline:auto;background:radial-gradient(circle at 12% 18%,#b9ea96 0 9%,transparent 9.5%),radial-gradient(circle at 88% 80%,#b9ea96 0 11%,transparent 11.5%),radial-gradient(circle at 60% 50%,#a7e283 0 7%,transparent 7.5%),repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 14px,transparent 14px 28px),var(--grass);border:4px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink),inset 0 -10px 0 rgba(22,41,107,.08);overflow:hidden}
.road{position:absolute;inset:0;width:100%;height:100%}
/* stations: cut-out buildings standing on a raised round platform */
.node{position:absolute;width:15%;aspect-ratio:1/1;transform:translate(-50%,-95%);direction:rtl;pointer-events:none}
.node .plat{position:absolute;left:4%;right:4%;bottom:4%;height:30%;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,#fff 0 18%,transparent 62%),var(--pl,#E9EDF7);border:3px solid var(--ink);box-shadow:0 5px 0 -1px color-mix(in srgb,var(--pl,#E9EDF7) 62%,#16296B),0 5px 0 2px var(--ink),0 12px 10px rgba(22,41,107,.28)}
.node .bld{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);height:96%;width:auto;max-width:128%;object-fit:contain;filter:drop-shadow(3px 4px 0 rgba(22,41,107,.30)) drop-shadow(0 0 1px rgba(22,41,107,.7))}
.node .tag{position:absolute;bottom:-12%;left:50%;transform:translateX(-50%);background:var(--tc,#fff);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:0 10px;font-family:var(--f-display);font-weight:800;font-size:clamp(.62rem,2vw,.9rem);line-height:1.25;padding:0 7px;white-space:nowrap;z-index:2;box-shadow:0 2px 0 var(--ink);border-width:2px}
.node .bld[data-dome]{width:80%;height:74%;max-width:none;object-fit:cover;border:3px solid var(--ink);border-radius:50% 50% 12% 12%/58% 58% 12% 12%;bottom:22%;filter:drop-shadow(3px 4px 0 rgba(22,41,107,.3))}
.node.work .plat{--pl:#FFD23F;background:repeating-linear-gradient(45deg,#FFD23F 0 8px,#2A2A2A 8px 16px)}
.node.work .bld{height:74%;bottom:20%}
.node.work .tag{--tc:#E39A00}
.node.start .plat{display:none}
.node.start .bld{height:82%;bottom:8%;filter:drop-shadow(0 5px 0 rgba(22,41,107,.4))}
.node.castle{width:22%;transform:translate(-50%,-80%)}
.node.castle .plat{--pl:#C9B6FF}
.node.castle .bld{height:104%;bottom:12%}
.node.castle .tag{--tc:var(--violet)}
.done{position:absolute;bottom:2%;width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;z-index:3}
.done svg{width:9px;height:9px}
.done.d0{background:var(--p0);left:0}.done.d1{background:var(--p1);right:0}
/* player cars drive along the road */
.car{position:absolute;width:8%;aspect-ratio:64/36;left:calc(var(--x)*1%);top:calc(var(--y)*1%);transform:translate(-50%,-50%) rotate(var(--r,0deg));transition:left .7s cubic-bezier(.45,0,.4,1),top .7s cubic-bezier(.45,0,.4,1),transform .2s ease-out;z-index:20;filter:drop-shadow(0 3px 0 rgba(22,41,107,.5))}
.car svg{width:100%;height:100%;display:block}
.car.active svg{animation:idle .35s ease-in-out infinite alternate}
.car.active::after{content:"";position:absolute;inset:-28%;border:3px dashed #fff;border-radius:50%;opacity:.9;animation:spinring 4s linear infinite}
@keyframes idle{to{transform:translateY(-1.5px) scale(1.04)}}
@keyframes spinring{to{transform:rotate(360deg)}}
.deckbox{position:absolute;left:30%;right:3%;top:79.5%;bottom:3%;display:grid;place-items:center;direction:rtl;z-index:25}
.deck{position:relative;width:100%;height:100%;max-height:100%;border:4px solid var(--ink);border-radius:18px;background:var(--dc,var(--sun));color:#fff;font-family:var(--f-display);font-weight:800;display:grid;place-items:center;align-content:center;gap:0;line-height:1.1;box-shadow:0 5px 0 var(--ink),-5px -5px 0 -1px #fff,-5px -5px 0 2px var(--ink);padding:4px 8px;font-size:clamp(.95rem,3.4vw,1.45rem);-webkit-text-stroke:0;text-shadow:0 2px 0 rgba(22,41,107,.55)}
.deck small{font-family:var(--f-body);font-size:.62em;font-weight:700;text-shadow:none;opacity:.95}
.deck:active{transform:translateY(3px)}
.deck[disabled]{filter:grayscale(.6);opacity:.7}
.deck.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(22,41,107,.62);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(14px,env(safe-area-inset-top,0px)) 12px max(14px,env(safe-area-inset-bottom,0px))}
.ov>.box{margin-block:auto;width:min(100%,540px)}#cardOv>.box{width:min(100%,400px)}
.card{background:var(--paper);border:5px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:pop .28s ease-out;--tc:var(--blue)}
@keyframes pop{from{transform:scale(.88) translateY(14px);opacity:0}}
.card-h{display:flex;align-items:center;gap:8px;background:var(--tc);color:#fff;padding:7px 12px;border-bottom:4px solid var(--ink)}
.card.work .card-h{background:repeating-linear-gradient(45deg,#FFD23F 0 14px,#2A2A2A 14px 28px);color:var(--ink)}
.hbadge{display:flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:1px 8px 1px 3px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;flex:none}
.hbadge img{height:26px;width:26px;object-fit:cover;border-radius:8px}
.htitle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.12rem;line-height:1.15;text-shadow:0 2px 0 rgba(22,41,107,.4)}
.card.work .htitle{text-shadow:0 2px 0 #FFE98A;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 10px}
.htitle svg{width:21px;height:21px;flex:none}
.hstars{display:flex;direction:ltr}
.hstars svg{width:19px;height:19px}
.mnum{background:#E5483B;color:#fff;border:3px solid var(--ink);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;flex:none}
.card-b{padding:12px 12px 6px;display:grid;gap:9px}
.instr{margin:0;text-align:center;font-weight:700;color:var(--ink-2)}
.micon{height:46px;justify-self:center;border-radius:12px}
.q{display:grid;gap:10px;font-size:1.2rem}
.q .eq{font-size:clamp(1.3rem,5.4vw,1.75rem);line-height:1.5}
.q .eq.big{font-size:clamp(1.6rem,6.6vw,2.2rem)}
.q p{margin:0;text-align:center;font-weight:700;font-size:clamp(1rem,4vw,1.18rem);line-height:1.7;text-wrap:pretty}
.fld{font-family:var(--f-display);font-weight:800;font-size:inherit;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px;min-width:2.5ch;height:1.55em;padding:0 .35em;vertical-align:middle;line-height:1;margin-inline:2px;box-shadow:0 3px 0 var(--ink)}
.fld.empty{color:#9AA4C7}
.fld.on{background:#FFF3B0;outline:4px solid var(--sun-d);outline-offset:1px}
.fld.good{background:#C9F2CF;color:#14602A}
.fld.wrong{background:#FFD3CC;color:#8C1D10}
.fld.shake,.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:260px;width:100%;margin:0 auto 12px;padding-inline:14px}
.card-f{display:grid;gap:6px}
.key{background:#fff;border:3px solid var(--ink);border-radius:12px;height:42px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.key.go{background:#7ED957}
.key.back{background:#FFD3CC}
.key svg{width:22px;height:22px}
.timer{display:flex;align-items:center;justify-content:center;gap:12px;padding:0 14px}
.hg{width:54px;height:76px;flex:none}
.tnum{font-family:var(--f-display);font-weight:800;font-size:2.4rem;min-width:2ch;text-align:center;direction:ltr}
.tbar{flex:1;height:16px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden;max-width:240px}
.tbar i{display:block;height:100%;background:var(--coral);width:100%;transform-origin:right}
.timer.low .tnum{color:var(--bad);animation:pulse .5s infinite}
.intro{display:grid;gap:12px;justify-items:center;text-align:center;padding-bottom:12px}
.intro .hg{width:62px;height:88px}
.intro p{margin:0;font-weight:700;font-size:1.1rem}
.res{padding:4px 12px 14px;display:grid;gap:10px;justify-items:center;text-align:center}
.rtitle{font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1.2}
.res.ok .rtitle{color:var(--ok)}.res.bad .rtitle{color:var(--bad)}
.rstars{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:1.5rem;direction:ltr}
.rstars svg{width:34px;height:34px;animation:starpop .5s ease-out both}
.rstars svg:nth-child(3){animation-delay:.12s}.rstars svg:nth-child(4){animation-delay:.24s}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.35) rotate(10deg)}}
.rexp{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;max-width:100%}
.rexp .eq{font-size:1.3rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 8px;font-family:var(--f-display);font-weight:800;font-size:1.5rem;direction:ltr;box-shadow:0 4px 0 var(--ink)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice.good{background:#C9F2CF}.choice.wrong{background:#FFD3CC}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 0;font-family:var(--f-display);font-weight:800;font-size:1.3rem;box-shadow:0 3px 0 var(--ink);direction:ltr}
.tile.used{background:#C9F2CF;opacity:.6;box-shadow:none;transform:translateY(3px)}
.tile.wrong{background:#FFD3CC}
.ask{text-align:center;font-weight:800;font-size:1.25rem}
.lives{text-align:center;font-weight:700;color:var(--ink-2)}
.ann{text-align:center;display:grid;gap:10px;justify-items:center;padding:20px 16px 22px}
.ann img{max-height:150px;width:auto;max-width:80%;object-fit:contain}
.ann .spin{animation:spinkey 2.2s ease-in-out infinite}
@keyframes spinkey{50%{transform:rotate(14deg) scale(1.1)}}
.ann h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.2;text-wrap:balance}
.ann p{margin:0;font-size:1.1rem;font-weight:500;text-wrap:balance}
.rules{max-height:min(78vh,640px);overflow:auto;display:grid;gap:12px;padding:6px 4px 4px}
.rules h4{margin:0;font-family:var(--f-display);font-size:1.15rem;font-weight:800}
.rules p{margin:2px 0 0}
.rules .rbox{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px}
.end{padding:18px 14px 20px;display:grid;gap:14px;text-align:center}
.end h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.2}
.results{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rcard{background:#fff;border:4px solid var(--ink);border-radius:18px;padding:10px 6px;display:grid;gap:3px;justify-items:center;min-width:0}
.rcard.win{background:#FFF3B0;box-shadow:0 5px 0 var(--sun-d)}
.rcard img.medal{height:96px;width:auto}
.rcard b{font-family:var(--f-display);font-size:1.15rem;overflow-wrap:anywhere}
.rcard small{font-size:.88rem;color:var(--ink-2);line-height:1.35}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:80;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:560px){.olgrid{grid-template-columns:1fr}}
/* phones: the two player cards sit side by side, so stack the car above the details */
@media (max-width:640px){.pcard{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;padding:8px 6px;overflow:hidden}.pcard .av{width:70px}.pinfo{justify-items:center;width:100%}.pname{justify-content:center;font-size:1.02rem}.starrow{justify-content:center;flex-wrap:wrap}.starrow svg{width:19px;height:19px}.keys{justify-content:center;max-width:100%}.keys img{height:19px}.pwhere,.ptotal{font-size:.8rem}}
@media (max-width:420px){.fields,.levels,.results{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(5,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
